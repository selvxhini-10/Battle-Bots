[project]
name = "solemates"
version = "0.1.0"
description = "Simulation-first sock matching pipeline for BracketBot"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
viewer = ["rerun-sdk>=0.26"]
sam = [
    "torch>=1.7",
    "torchvision>=0.8",
    "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git",
]
clip = [
    "torch>=1.7",
    "torchvision>=0.8",
    "Pillow>=9",
    "openai-clip @ git+https://github.com/openai/CLIP.git",
]
dev = ["pytest>=8"]

[project.scripts]
solemates = "solemates.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["solemates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
